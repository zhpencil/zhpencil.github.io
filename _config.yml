# ------------------------------
# 站点信息
# ------------------------------
name: zhPencil
title: zhPencil
description: 欢迎来到我写字的地方。
url: "https://zhpencil.github.io"
baseurl: ""

# ------------------------------
# 文章链接格式
# ------------------------------
permalink: /:year/:month/:day/:title/
timezone: Asia/Shanghai

# ------------------------------
# 构建设置
# ------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

sass:
  style: :compressed
  sass_dir: _sass

plugins:
  - jekyll-feed
  - jekyll-sitemap

include: [".htaccess"]

exclude:
  - README.md
  - LICENSE
  - vendor