<textarea class="new_textarea" id="new-textarea" spellcheck="false" aria-label="临时文本框" placeholder="在这里输入内容……"></textarea>

<script>
(function () {
	var date = new Date();
	var pad = function (number) {
		return (number < 10 ? '0' : '') + number;
	};
	var dateElement = document.getElementById('editor-date');
	if (dateElement) {
		dateElement.textContent = date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
	}
})();
</script>
